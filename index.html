<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>물망서림 (Forget-Me-Not Bookshop) - Korean Micro-Learning Novel</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-soft: #eff6ff;
      --accent: #b45309;
      --accent-bg: #fffbeb;
      --accent-border: #fde68a;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding-bottom: 60px;
    }

    /* 상단 헤더 */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .header-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .brand h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .brand p {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .lang-select {
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    /* 메인 컨테이너 */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 16px;
    }

    /* 회차 네비게이션 */
    .ep-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }
    .ep-btn {
      padding: 7px 15px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .ep-btn.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    /* 에피소드 헤더 카드 */
    .ep-header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .arc-badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary-dark);
      background: var(--primary-soft);
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .ep-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
    }

    /* 난이도 탭 */
    .level-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .level-btn {
      padding: 10px 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .level-btn.active {
      background: var(--primary-soft);
      color: var(--primary-dark);
      border-color: var(--primary);
      box-shadow: 0 1px 3px rgba(59, 130, 246, 0.15);
    }

    /* 오늘의 핵심 대사 카드 (레벨별 Shorts 하이라이트) */
    .key-scene-card {
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .key-scene-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .key-scene-label {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--accent);
    }
    .key-scene-line {
      font-size: 1.18rem;
      font-weight: 800;
      color: #111827;
      line-height: 1.45;
      margin-bottom: 6px;
    }
    .key-scene-desc {
      font-size: 0.89rem;
      color: #4b5563;
      line-height: 1.55;
    }

    /* 컨트롤 바 */
    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn-sm {
      padding: 7px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-sm:hover { background: #f1f5f9; }
    .btn-sm.primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .btn-sm.primary:hover { background: var(--primary-dark); }
    .btn-sm.toggle-on {
      background: var(--primary-soft);
      color: var(--primary-dark);
      border-color: #93c5fd;
    }

    /* 본문 읽기 카드 */
    .story-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 20px;
      margin-bottom: 18px;
    }
    .vocab-hint {
      font-size: 0.8rem;
      color: var(--muted);
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .paragraph {
      margin-bottom: 18px;
    }
    .paragraph:last-child { margin-bottom: 0; }
    .sentence-unit {
      display: inline;
      cursor: pointer;
      border-radius: 6px;
      padding: 2px 3px;
      transition: background 0.15s;
    }
    .sentence-unit:hover { background: #f1f5f9; }
    .sentence-unit.speaking { background: #fef08a; }
    .ko-line {
      font-size: 1.08rem;
      color: #0f172a;
      word-break: keep-all;
    }
    ruby {
      ruby-align: center;
      margin-right: 1px;
    }
    rt {
      font-size: 0.68rem;
      color: var(--primary-dark);
      font-weight: 600;
    }
    .vocab-word {
      border-bottom: 2px dashed #f59e0b;
      font-weight: 700;
      color: #92400e;
      cursor: pointer;
      padding: 0 1px;
    }
    .vocab-word:hover { background: #fef3c7; border-radius: 4px; }

    /* 번역/쉬운 풀이 블록 */
    .trans-block {
      margin-top: 8px;
      padding: 10px 14px;
      background: #f8fafc;
      border-left: 3px solid #cbd5e1;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      color: #475569;
    }

    /* 섹션 카드 공통 */
    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }
    .section-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 핵심 표현 & 예문 */
    .expr-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      background: #fcfcfd;
    }
    .expr-item:last-child { margin-bottom: 0; }
    .expr-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .expr-ko { font-size: 1.02rem; font-weight: 800; color: var(--primary-dark); }
    .expr-pron { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
    .expr-meaning { font-size: 0.9rem; color: var(--text); margin-bottom: 10px; }
    .expr-ex {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 0.88rem;
    }
    .expr-ex-ko { font-weight: 700; color: #0f172a; }
    .expr-ex-tr { color: var(--muted); font-size: 0.83rem; }

    /* 롤플레이 스피킹 */
    .rp-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
    }
    .rp-situation {
      font-size: 0.92rem;
      color: #166534;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .rp-target {
      background: #ffffff;
      border: 1px solid #dcfce7;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .rp-ko { font-size: 1.05rem; font-weight: 800; color: #0f172a; }
    .rp-pron { font-size: 0.82rem; color: var(--muted); }
    .rp-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    /* 퀴즈 */
    .quiz-item {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }
    .quiz-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
    .quiz-q { font-weight: 700; font-size: 0.96rem; margin-bottom: 10px; white-space: pre-line; }
    .quiz-opts { display: grid; gap: 8px; }
    .quiz-opt {
      text-align: left;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #ffffff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .quiz-opt:hover { background: #f8fafc; }
    .quiz-opt.correct { background: #dcfce7; border-color: var(--success); color: #14532d; font-weight: 700; }
    .quiz-opt.wrong { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }
    .quiz-exp {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #334155;
      background: #f1f5f9;
      padding: 8px 12px;
      border-radius: 8px;
    }

    /* 쇼츠 영역 */
    .shorts-wrap {
      position: relative;
      width: 100%;
      max-width: 340px;
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      border-radius: 14px;
      overflow: hidden;
      background: #0f172a;
    }
    .shorts-wrap iframe { width: 100%; height: 100%; border: none; }
    .shorts-empty {
      text-align: center;
      padding: 24px;
      background: #f8fafc;
      border-radius: 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* 단어 팝업 모달 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: #ffffff;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.15);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .modal-word { font-size: 1.3rem; font-weight: 800; color: #0f172a; }
    .modal-pron { font-size: 0.85rem; color: var(--primary-dark); font-weight: 600; }
    .modal-pos {
      display: inline-block;
      font-size: 0.75rem;
      background: #f1f5f9;
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 6px;
    }
    .modal-meaning { font-size: 0.98rem; font-weight: 600; margin-bottom: 12px; }
    .modal-ex {
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.88rem;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--muted);
    }

    .loading-box {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-weight: 600;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <h1>📚 물망서림 (Forget-Me-Not Bookshop)</h1>
      <p id="ui-subtitle">매일 밤 만나는 한국어 판타지 웹소설</p>
    </div>
    <select id="lang-switcher" class="lang-select" onchange="changeLanguage(this.value)" aria-label="Language">
      <option value="ko">🇰🇷 한국어</option>
      <option value="en">🇺🇸 English</option>
      <option value="vi">🇻🇳 Tiếng Việt</option>
      <option value="th">🇹🇭 ภาษาไทย</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="ja">🇯🇵 日本語</option>
    </select>
  </div>
</header>

<main id="app">
  <div class="loading-box">Loading episodes...</div>
</main>

<!-- 단어 사전 모달 -->
<div id="vocab-modal" class="modal-backdrop" onclick="closeVocabModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div>
        <div>
          <span id="m-word" class="modal-word"></span>
          <span id="m-pos" class="modal-pos"></span>
        </div>
        <div id="m-pron" class="modal-pron"></div>
      </div>
      <div style="display:flex; gap:6px; align-items:center;">
        <button class="btn-sm primary" id="m-speak-btn">🔊</button>
        <button class="modal-close" onclick="closeVocabModal()">✕</button>
      </div>
    </div>
    <div id="m-meaning" class="modal-meaning"></div>
    <div class="modal-ex">
      <div id="m-ex-ko" style="font-weight:700; color:#0f172a;"></div>
      <div id="m-ex-tr" style="color:#64748b; margin-top:4px;"></div>
    </div>
  </div>
</div>

      shortsPending: "วิดีโอไฮไลต์ AI จะเชื่อมต่อเร็วๆ นี้",
      micError: "ไม่สามารถใช้งานไมโครโฟนในเบราว์เซอร์นี้ได้"
    },
    zh: {

      rpPlayMine: "▶️ 播放我的录音",
      quizTitle: "📝 章节理解小测验",
      quizReset: "↻ 重新作答",
      shortsTitle: "🎬 观看高光片段 (AI Shorts)",
      shortsPending: "定稿后将关联 AI 高光短视频。",
      micError: "浏览器无法获取麦克风权限。"
    },
    ja: {
      subtitle: "毎晩出会う韓国語ファンタジーWeb小説",
      epUnit: "第",
      beg: "🟢 初級",
      int: "🟡 中級",
      adv: "🔴 上級",
      keySceneLabel: "✨ 今日の名セリフ (Key Expression)",
      playAll: "▶ 全文再生",
      stop: "■ 停止",
      pronOn: "🔤 発音表記: ON",
      pronOff: "🔤 発音表記: OFF",
      transOn: "🌐 日本語訳: ON",
      transOff: "🌐 日本語訳: OFF",
      vocabHint: "💡 点線の下線単語をタップすると辞書と例文が表示されます。文をタップすると音声が流れます。",
      exprTitle: "✨ 今日の重要表現＆例文",
      rpTitle: "🎙️ 一人称ロールプレイスピーキング",
      rpShowLine: "👀 セリフを見る",
      rpHideLine: "🙈 セリフを隠す",
      rpListen: "🔊 ネイティブ音声",
      rpRecord: "🎙️ 自分の声を録音",
      rpStopRec: "⏹ 録音停止",
      rpPlayMine: "▶️ 録音を再生",
      quizTitle: "📝 エピソード確認クイズ",
      quizReset: "↻ やり直す",
      shortsTitle: "🎬 ハイライトシーンを見る (AI Shorts)",
      shortsPending: "推敲完了後にAIハイライト動画が公開されます。",
      micError: "ブラウザでマイクの権限を使用できません。"
    }
  };

  // URL 파라미터(?lang=en) 또는 저장된 언어 불러오기 (기본값: ko)
  const urlParams = new URLSearchParams(window.location.search);
  const initialLang = urlParams.get('lang') || localStorage.getItem('lms_lang') || 'ko';
  let currentLang = UI_STRINGS[initialLang] ? initialLang : 'ko';

  let episodesData = [];
  let currentEpIndex = 0;
  let currentLevel = 'beginner';
  let showPronunciation = true;
  let showTranslation = true;
  let showRpLine = false;
  let quizAnswers = {};

  // 오디오 및 녹음 상태
  let audioEl = null;
  let isPlayingAll = false;
  let speakingSentIdx = -1;
  let mediaRecorder = null;
  let recordedChunks = [];
  let recordedAudioUrl = null;
  let isRecording = false;

  function t(key) {
    return (UI_STRINGS[currentLang] && UI_STRINGS[currentLang][key]) || UI_STRINGS.en[key] || key;
  }

  async function init() {
    document.getElementById('lang-switcher').value = currentLang;
    document.getElementById('ui-subtitle').textContent = t('subtitle');
    await loadLanguageData(currentLang);
  }

  async function changeLanguage(lang) {
    stopAllAudio();
    currentLang = lang;
    localStorage.setItem('lms_lang', lang);
    document.getElementById('ui-subtitle').textContent = t('subtitle');
    quizAnswers = {};
    await loadLanguageData(lang);
  }

  async function loadLanguageData(lang) {
    const appEl = document.getElementById('app');
    appEl.innerHTML = `<div class="loading-box">Loading...</div>`;

    try {
      const res = await fetch(`data/episodes_${lang}.json?v=${Date.now()}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const rawList = await res.json();

      // Published 회차만 표시 (URL에 ?preview=1 붙이면 Draft도 확인 가능)
      const isPreview = urlParams.get('preview') === '1';
      episodesData = isPreview ? rawList : rawList.filter(e => e.status === 'Published');
      if (episodesData.length === 0) episodesData = rawList;

      if (currentEpIndex >= episodesData.length) currentEpIndex = 0;
      renderApp();
    } catch (err) {
      if (lang !== 'ko') {
        await loadLanguageData('ko');
      } else {
        appEl.innerHTML = `<div class="loading-box">아직 발행된 에피소드가 없습니다. (data/episodes_${lang}.json 확인 필요)</div>`;
      }
    }
  }

  function selectEpisode(idx) {
    stopAllAudio();
    currentEpIndex = idx;
    quizAnswers = {};
    showRpLine = false;
    recordedAudioUrl = null;
    renderApp();
  }

  function selectLevel(lvl) {
    stopAllAudio();
    currentLevel = lvl;
    quizAnswers = {};
    showRpLine = false;
    recordedAudioUrl = null;
    renderApp();
  }

  function togglePronunciation() {
    showPronunciation = !showPronunciation;
    renderApp();
  }

  function toggleTranslation() {
    showTranslation = !showTranslation;
    renderApp();
  }

  function toggleRpLine() {
    showRpLine = !showRpLine;
    renderApp();
  }

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /**
   * 본문 한국어 문장에 밑줄 단어(vocabDict)와 초급 루비 발음(ruby)을 안전하게 결합
   */
  function formatSentenceHtml(sent, vocabDict) {
    const keys = Object.keys(vocabDict || {}).sort((a, b) => b.length - a.length);

    const highlightWords = (plainText) => {
      let html = escapeHtml(plainText);
      keys.forEach(k => {
        if (!k) return;
        const safeKey = escapeHtml(k);
        if (html.includes(safeKey)) {
          const encodedKey = encodeURIComponent(k);
          html = html.split(safeKey).join(
            `<span class="vocab-word" onclick="event.stopPropagation(); openVocab('${encodedKey}')">${safeKey}</span>`
          );
        }
      });
      return html;
    };

    if (currentLevel === 'beginner' && showPronunciation && sent.ruby) {
      const pairs = sent.ruby.trim().split(/\s+/);
      return pairs.map(pair => {
        const barIdx = pair.indexOf('|');
        if (barIdx === -1) return highlightWords(pair);
        const wordPart = pair.slice(0, barIdx);
        const pronPart = pair.slice(barIdx + 1);
        return `<ruby>${highlightWords(wordPart)}<rt>${escapeHtml(pronPart)}</rt></ruby>`;
      }).join(' ');
    }

    return highlightWords(sent.ko);
  }

  function renderApp() {
    const appEl = document.getElementById('app');
    if (!episodesData || episodesData.length === 0) return;

    const ep = episodesData[currentEpIndex];
    const lvlData = ep.levels[currentLevel] || ep.levels.beginner;
    const vocabDict = lvlData.vocabDict || {};

    // 1. 회차 버튼
    const navHtml = episodesData.map((item, idx) => {
      let label = `${t('epUnit')}${item.ep}`;
      if (currentLang === 'ko') label = `${item.ep}화`;
      else if (currentLang === 'zh' || currentLang === 'ja') label = `${t('epUnit')}${item.ep}话`;
      return `<button class="ep-btn ${idx === currentEpIndex ? 'active' : ''}" onclick="selectEpisode(${idx})">${label}</button>`;
    }).join("");

    // 2. 선택된 레벨의 핵심 대사 카드
    const keySceneHtml = (lvlData.chunk && lvlData.chunk.trim() !== "") ? `
      <div class="key-scene-card">
        <div class="key-scene-top">
          <div class="key-scene-label">${t('keySceneLabel')}</div>
          <button class="btn-sm primary" onclick="speakKoreanText('${encodeURIComponent(lvlData.chunk)}')">🔊</button>
        </div>
        <div class="key-scene-line">${escapeHtml(lvlData.chunk)}</div>
        ${lvlData.chunkDesc ? `<div class="key-scene-desc">${escapeHtml(lvlData.chunkDesc)}</div>` : ''}
      </div>
    ` : '';

    // 3. 본문 문단 및 문장 렌더링
    const paragraphs = [];
    let currentPara = [];
    (lvlData.sentences || []).forEach((s, idx) => {
      currentPara.push({ ...s, idx });
      if (s.paraEnd) {
        paragraphs.push(currentPara);
        currentPara = [];
      }
    });
    if (currentPara.length > 0) paragraphs.push(currentPara);

    const storyHtml = paragraphs.map(pSents => {
      const koGroup = pSents.map(s => `
        <span class="sentence-unit ${speakingSentIdx === s.idx ? 'speaking' : ''}"
              id="sent-${s.idx}"
              onclick="playSingleSentence(${s.idx})">${formatSentenceHtml(s, vocabDict)}</span>
      `).join(' ');

      const transGroup = showTranslation
        ? `<div class="trans-block">${pSents.map(s => escapeHtml(s.trans)).join(' ')}</div>`
        : '';

      return `<div class="paragraph"><div class="ko-line">${koGroup}</div>${transGroup}</div>`;
    }).join('');

    // 4. 핵심 표현 카드
    const exprHtml = (lvlData.expressions || []).map(ex => `
      <div class="expr-item">
        <div class="expr-head">
          <div class="expr-ko">${escapeHtml(ex.ko)}</div>
          <button class="btn-sm" onclick="speakKoreanText('${encodeURIComponent(ex.ko)}')">🔊</button>
        </div>
        <div class="expr-pron">${escapeHtml(ex.pron || '')}</div>
        <div class="expr-meaning">${escapeHtml(ex.meaning || '')}</div>
        ${(ex.examples || []).map(item => `
          <div class="expr-ex">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
              <span class="expr-ex-ko">${escapeHtml(item.ko)}</span>
              <button class="btn-sm" style="padding:3px 8px; font-size:0.75rem;" onclick="speakKoreanText('${encodeURIComponent(item.ko)}')">🔊</button>
            </div>
            <div class="expr-ex-tr">${escapeHtml(item.trans)}</div>
          </div>
        `).join('')}
      </div>
    `).join('');

    // 5. 1인칭 롤플레이 카드
    const rp = lvlData.roleplay || {};
    const rpHtml = rp.ko ? `
      <div class="section-card">
        <div class="section-title">${t('rpTitle')}</div>
        <div class="rp-box">
          <div class="rp-situation">${escapeHtml(rp.situation || '')}</div>
          ${showRpLine ? `
            <div class="rp-target">
              <div class="rp-ko">${escapeHtml(rp.ko)}</div>
              <div class="rp-pron">${escapeHtml(rp.pron || '')}</div>
            </div>
          ` : ''}
          <div class="rp-actions">
            <button class="btn-sm" onclick="toggleRpLine()">${showRpLine ? t('rpHideLine') : t('rpShowLine')}</button>
            <button class="btn-sm primary" onclick="speakKoreanText('${encodeURIComponent(rp.ko)}')">${t('rpListen')}</button>
            <button class="btn-sm" onclick="toggleRecording()">${isRecording ? t('rpStopRec') : t('rpRecord')}</button>
            ${recordedAudioUrl ? `<button class="btn-sm toggle-on" onclick="playRecordedAudio()">${t('rpPlayMine')}</button>` : ''}
          </div>
        </div>
      </div>
    ` : '';

    // 6. 4지선다 퀴즈
    const quizList = lvlData.quiz || [];
    const quizHtml = quizList.length > 0 ? `
      <div class="section-card">
        <div class="section-title">
          <span>${t('quizTitle')}</span>
          <button class="btn-sm" onclick="resetQuiz()">${t('quizReset')}</button>
        </div>
        ${quizList.map((q, qIdx) => {
          const picked = quizAnswers[qIdx];
          const answered = picked !== undefined;
          return `
            <div class="quiz-item">
              <div class="quiz-q">${qIdx + 1}. ${escapeHtml(q.question)}</div>
              <div class="quiz-opts">
                ${(q.options || []).map((opt, oIdx) => {
                  let cls = 'quiz-opt';
                  if (answered) {
                    if (oIdx === q.answer) cls += ' correct';
                    else if (oIdx === picked) cls += ' wrong';
                  }
                  return `<button class="${cls}" onclick="answerQuiz(${qIdx}, ${oIdx})">${escapeHtml(opt)}</button>`;
                }).join('')}
              </div>
              ${answered ? `<div class="quiz-exp">💡 ${escapeHtml(q.explanation || '')}</div>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    ` : '';

    // 7. AI 쇼츠 임베드
    const shortsHtml = `
      <div class="section-card">
        <div class="section-title">${t('shortsTitle')}</div>
        ${ep.shortsId ? `
          <div class="shorts-wrap">
            <iframe src="https://www.youtube.com/embed/${escapeHtml(ep.shortsId)}" allowfullscreen></iframe>
          </div>
        ` : `<div class="shorts-empty">${t('shortsPending')}</div>`}
      </div>
    `;

    appEl.innerHTML = `
      <div class="ep-nav">${navHtml}</div>

      <div class="ep-header">
        <div class="arc-badge">${escapeHtml(ep.arc || '')}</div>
        <div class="ep-title">${escapeHtml(ep.title || '')}</div>
      </div>

      <div class="level-tabs">
        <button class="level-btn ${currentLevel === 'beginner' ? 'active' : ''}" onclick="selectLevel('beginner')">${t('beg')}</button>
        <button class="level-btn ${currentLevel === 'intermediate' ? 'active' : ''}" onclick="selectLevel('intermediate')">${t('int')}</button>
        <button class="level-btn ${currentLevel === 'advanced' ? 'active' : ''}" onclick="selectLevel('advanced')">${t('adv')}</button>
      </div>

      ${keySceneHtml}

      <div class="toolbar">
        <button class="btn-sm primary" onclick="togglePlayAll()">
          ${isPlayingAll ? t('stop') : t('playAll')}
        </button>
        <div class="control-group">
          ${currentLevel === 'beginner' ? `
            <button class="btn-sm ${showPronunciation ? 'toggle-on' : ''}" onclick="togglePronunciation()">
              ${showPronunciation ? t('pronOn') : t('pronOff')}
            </button>
          ` : ''}
          <button class="btn-sm ${showTranslation ? 'toggle-on' : ''}" onclick="toggleTranslation()">
            ${showTranslation ? t('transOn') : t('transOff')}
          </button>
        </div>
      </div>

      <div class="story-card">
        <div class="vocab-hint">${t('vocabHint')}</div>
        ${storyHtml}
      </div>

      ${exprHtml ? `<div class="section-card"><div class="section-title">${t('exprTitle')}</div>${exprHtml}</div>` : ''}

      ${rpHtml}
      ${quizHtml}
      ${shortsHtml}
    `;
  }

  // ==================== 단어 사전 모달 ====================
  function openVocab(encodedKey) {
    const key = decodeURIComponent(encodedKey);
    const ep = episodesData[currentEpIndex];
    const lvlData = ep.levels[currentLevel] || ep.levels.beginner;
    const entry = (lvlData.vocabDict || {})[key];
    if (!entry) return;

    document.getElementById('m-word').textContent = entry.word || key;
    document.getElementById('m-pos').textContent = entry.pos || '';
    document.getElementById('m-pron').textContent = entry.pron ? `[${entry.pron}]` : '';
    document.getElementById('m-meaning').textContent = entry.meaning || '';
    document.getElementById('m-ex-ko').textContent = entry.example || '';
    document.getElementById('m-ex-tr').textContent = entry.exampleTrans || '';
    document.getElementById('m-speak-btn').onclick = () => speakKoreanText(encodeURIComponent(entry.word || key));

    document.getElementById('vocab-modal').classList.add('open');
  }

  function closeVocabModal() {
    document.getElementById('vocab-modal').classList.remove('open');
  }

  // ==================== 오디오 & 한국어 TTS ====================
  function stopAllAudio() {
    isPlayingAll = false;
    speakingSentIdx = -1;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (audioEl) {
      audioEl.pause();
      audioEl = null;
    }
    updateHighlight();
  }

  function updateHighlight() {
    document.querySelectorAll('.sentence-unit').forEach(el => el.classList.remove('speaking'));
    if (speakingSentIdx >= 0) {
      const target = document.getElementById(`sent-${speakingSentIdx}`);
      if (target) target.classList.add('speaking');
    }
  }

  function speakKoreanText(encodedText) {
    stopAllAudio();
    const text = decodeURIComponent(encodedText);
    if (!window.speechSynthesis) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    utter.rate = currentLevel === 'beginner' ? 0.88 : 0.98;
    window.speechSynthesis.speak(utter);
  }

  function playSingleSentence(idx) {
    const ep = episodesData[currentEpIndex];
    const lvlData = ep.levels[currentLevel] || ep.levels.beginner;
    const sent = lvlData.sentences[idx];
    if (!sent) return;

    stopAllAudio();
    speakingSentIdx = idx;
    updateHighlight();

    const utter = new SpeechSynthesisUtterance(sent.ko);
    utter.lang = 'ko-KR';
    utter.rate = currentLevel === 'beginner' ? 0.88 : 0.98;
    utter.onend = () => {
      speakingSentIdx = -1;
      updateHighlight();
    };
    window.speechSynthesis.speak(utter);
  }

  function togglePlayAll() {
    if (isPlayingAll) {
      stopAllAudio();
      renderApp();
      return;
    }

    const ep = episodesData[currentEpIndex];
    const lvlData = ep.levels[currentLevel] || ep.levels.beginner;

    // MP3 오디오 파일이 등록된 경우 MP3 재생, 없으면 TTS 순차 낭독
    if (lvlData.audioUrl) {
      stopAllAudio();
      isPlayingAll = true;
      audioEl = new Audio(lvlData.audioUrl);
      audioEl.onended = () => { isPlayingAll = false; renderApp(); };
      audioEl.play();
      renderApp();
      return;
    }

    const sents = lvlData.sentences || [];
    if (sents.length === 0) return;

    stopAllAudio();
    isPlayingAll = true;
    renderApp();

    let idx = 0;
    const speakNext = () => {
      if (!isPlayingAll || idx >= sents.length) {
        isPlayingAll = false;
        speakingSentIdx = -1;
        renderApp();
        return;
      }
      speakingSentIdx = idx;
      updateHighlight();

      const utter = new SpeechSynthesisUtterance(sents[idx].ko);
      utter.lang = 'ko-KR';
      utter.rate = currentLevel === 'beginner' ? 0.88 : 0.98;
      utter.onend = () => {
        idx++;
        speakNext();
      };
      window.speechSynthesis.speak(utter);
    };
    speakNext();
  }

  // ==================== 마이크 녹음 (롤플레이) ====================
  async function toggleRecording() {
    if (isRecording && mediaRecorder) {
      mediaRecorder.stop();
      isRecording = false;
      renderApp();
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'audio/webm' });
        recordedAudioUrl = URL.createObjectURL(blob);
        stream.getTracks().forEach(track => track.stop());
        renderApp();
      };
      mediaRecorder.start();
      isRecording = true;
      renderApp();
    } catch (e) {
      alert(t('micError'));
    }
  }

  function playRecordedAudio() {
    if (!recordedAudioUrl) return;
    const audio = new Audio(recordedAudioUrl);
    audio.play();
  }

  // ==================== 퀴즈 처리 ====================
  function answerQuiz(qIdx, oIdx) {
    if (quizAnswers[qIdx] !== undefined) return;
    quizAnswers[qIdx] = oIdx;
    renderApp();
  }

  function resetQuiz() {
    quizAnswers = {};
    renderApp();
  }

  init();
</script>
