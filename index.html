<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>물망서림 (勿忘書林) | Forget-Me-Not Bookshop Korean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f7f5f0;
      --card-bg: #ffffff;
      --primary: #1e293b;
      --accent: #b45309;
      --accent-soft: #fef3c7;
      --text-main: #1f2937;
      --text-sub: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.8;
      padding-bottom: 60px;
    }

    header {
      background: var(--primary);
      color: #fff;
      padding: 18px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    header h1 {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.35rem;
    }
    header p {
      font-size: 0.82rem;
      color: #cbd5e1;
      margin-top: 2px;
    }
    .mode-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #f59e0b;
      color: #1e293b;
    }

    .container {
      max-width: 740px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* 회차 버튼 */
    .ep-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
    .ep-btn {
      flex: 0 0 auto;
      padding: 8px 15px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-main);
    }
    .ep-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .ep-meta {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .ep-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.42rem;
      color: var(--primary);
      margin-bottom: 16px;
    }

    /* 레벨 탭 */
    .level-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 16px;
      background: #f1f5f9;
      padding: 5px;
      border-radius: 12px;
    }
    .level-btn {
      padding: 9px 6px;
      border: none;
      border-radius: 8px;
      background: transparent;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-sub);
    }
    .level-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    /* 오디오 컨트롤 바 */
    .audio-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
    }
    .audio-controls { display: flex; gap: 8px; align-items: center; }
    .audio-badge {
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: #e2e8f0;
      color: #475569;
      font-weight: 600;
    }
    .audio-badge.mp3 { background: #dcfce7; color: #166534; }
    .btn-sm {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-sm.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .speed-select {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.8rem;
    }

  /* 스토리 본문 (일반 소설 줄글 스타일) */
    .story-content {
      font-size: 1.06rem;
      line-height: 1.95;
      word-break: keep-all;
    }
    .story-para {
      margin-bottom: 1.15em;
      text-indent: 0.2em;
    }
    .story-para:last-child {
      margin-bottom: 0;
    }
    .sentence-inline {
      cursor: pointer;
      border-radius: 4px;
      padding: 2px 1px;
      transition: background-color 0.15s ease;
    }
    .sentence-inline:hover {
      background-color: #f1f5f9;
    }
    .sentence-inline.speaking {
      background-color: var(--accent-soft);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    /* 학습 포인트 및 어휘 박스 */
    .study-meta-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
      font-size: 0.9rem;
    }
    .study-row { margin-bottom: 10px; }
    .study-row:last-child { margin-bottom: 0; }
    .study-label {
      font-weight: 700;
      color: var(--primary);
      font-size: 0.82rem;
      display: block;
      margin-bottom: 3px;
    }

    /* 핵심 구문 하이라이트 */
    .chunk-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }
    .chunk-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .chunk-phrase {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .chunk-desc { font-size: 0.88rem; color: #4b5563; }

    /* 초고속 Lite 유튜브 쇼츠 */
    .shorts-section {
      margin-top: 24px;
      text-align: center;
    }
    .shorts-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--primary);
    }
    .shorts-wrapper {
      position: relative;
      width: 100%;
      max-width: 315px;
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      background: #0f172a;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      cursor: pointer;
    }
    .shorts-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: rgba(0,0,0,0.25);
    }
    .play-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(220, 38, 38, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    .shorts-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .shorts-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #94a3b8;
      padding: 20px;
      font-size: 0.86rem;
      cursor: default;
    }

    /* ================= 작가 검수 모드 (?mode=review) ================= */
    .review-bar {
      background: #fffbeb;
      border: 1px solid #f59e0b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .review-card {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .review-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .status-published { background: #dcfce7; color: #166534; }
    .status-draft { background: #fef3c7; color: #92400e; }
    .review-field { margin-bottom: 14px; }
    .review-field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--primary);
    }
    .review-field textarea, .review-field input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .review-field textarea { min-height: 130px; resize: vertical; }
    .review-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 12px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.88rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <h1>물망서림 (勿忘書林) <span style="font-weight:400; font-size:0.95rem;">Forget-Me-Not Bookshop</span></h1>
  <p id="header-sub">매일 밤 12시, 이야기로 배우는 살아있는 한국어</p>
  <div id="review-badge" class="mode-badge" style="display:none;">✍️ 작가 검수 모드 (전체 흐름 확인 및 수정)</div>
</header>

<div class="container" id="app">
  <div style="text-align:center; padding:40px; color:#64748b;">이야기를 불러오는 중...</div>
</div>

<audio id="mp3-player" preload="none"></audio>
<div class="toast" id="toast">저장되었습니다.</div>

<script>
  /**
   * [선택 설정] Google Apps Script 배포 후 웹 앱 URL을 아래에 넣으면
   * ?mode=review 화면에서 시트의 Draft 글을 불러오고 수정·발행할 수 있습니다.
   * 일반 학습자는 이 URL을 거치지 않고 GitHub의 data/episodes.json을 0.1초 만에 읽습니다.
   */
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnlz7LaoA_99pSXK_Urb_p8VMfLUcZq1hdhogENpd_qFhEHUk5NaWFmeTp-HoKVsNc5w/exec";

  const urlParams = new URLSearchParams(window.location.search);
  const isReviewMode = urlParams.get('mode') === 'review';

  let episodesData = [];
  let currentEpIndex = 0;
  let currentLevel = 'beginner'; // beginner | intermediate | advanced
  let speechRate = 0.95;

  const appEl = document.getElementById('app');
  const mp3Player = document.getElementById('mp3-player');
  const toastEl = document.getElementById('toast');

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2800);
  }

  async function initApp() {
    try {
      if (isReviewMode && APPS_SCRIPT_URL) {
        // 검수 모드 + Apps Script 연결 시 시트에서 Draft 포함 전체 로드
        const res = await fetch(`${APPS_SCRIPT_URL}?mode=review`);
        episodesData = await res.json();
      } else {
        // 일반 모드: GitHub 정적 JSON 파일 초고속 로드
        const res = await fetch(`./data/episodes.json?t=${Date.now()}`);
        const allData = await res.json();
        episodesData = isReviewMode ? allData : allData.filter(item => item.status === 'Published');
        if (episodesData.length === 0) episodesData = allData;
      }
    } catch (err) {
      appEl.innerHTML = `<div class="card">데이터(data/episodes.json)를 불러오지 못했습니다. 파일 경로를 확인해 주세요.</div>`;
      return;
    }

    if (isReviewMode) {
      document.getElementById('review-badge').style.display = 'inline-block';
      document.getElementById('header-sub').textContent = "전체 에피소드 흐름 검수 및 Google Sheets 연동";
      renderReviewMode();
    } else {
      renderLearnerMode();
    }
  }

  // ==================== 1. 학습자 화면 렌더링 ====================
  function renderLearnerMode() {
    const ep = episodesData[currentEpIndex];
    const lvlData = ep.levels[currentLevel];
    const hasMp3 = Boolean(lvlData.audioUrl && lvlData.audioUrl.trim() !== "");

    const navHtml = episodesData.map((item, idx) => `
      <button class="ep-btn ${idx === currentEpIndex ? 'active' : ''}" onclick="selectEpisode(${idx})">
        ${item.ep}화
      </button>
    `).join("");

    let sentencesHtml = '<p class="story-para">';
    lvlData.sentences.forEach((item, idx) => {
      const cleanText = item.text.replace(/^\[\d+\]\s*/, '');
      sentencesHtml += `<span class="sentence-inline" id="sent-${idx}" onclick="playSegment(${idx})">${cleanText}</span> `;
      if (item.paraEnd && idx < lvlData.sentences.length - 1) {
        sentencesHtml += '</p><p class="story-para">';
      }
    });
    sentencesHtml += '</p>';

    // Lite 유튜브 쇼츠 렌더링 (초기에는 썸네일만 띄워 속도 극대화)
    let shortsHtml = "";
    if (ep.shortsId && ep.shortsId.trim() !== "") {
      shortsHtml = `
        <div class="shorts-wrapper" id="shorts-box-${ep.ep}" onclick="loadYoutubeIframe('${ep.ep}', '${ep.shortsId.trim()}')">
          <img src="https://i.ytimg.com/vi/${ep.shortsId.trim()}/hqdefault.jpg" alt="AI 쇼츠 썸네일" loading="lazy" />
          <div class="play-overlay">
            <div class="play-circle">▶</div>
            <div style="font-size:0.85rem; font-weight:700;">클립 재생하기 (Shorts)</div>
          </div>
        </div>
      `;
    } else {
      shortsHtml = `
        <div class="shorts-wrapper">
          <div class="shorts-placeholder">
            <div style="font-size:1.8rem; margin-bottom:8px;">🎬</div>
            <div><strong>AI 하이라이트 쇼츠 준비 중</strong></div>
            <div style="font-size:0.78rem; margin-top:6px;">퇴고 완료 후 하이라이트 클립이 연결됩니다.</div>
          </div>
        </div>
      `;
    }

    appEl.innerHTML = `
      <div class="ep-nav">${navHtml}</div>

      <div class="card">
        <div class="ep-meta">${ep.arc}</div>
        <h2 class="ep-title">${ep.title}</h2>

        <div class="level-tabs">
          <button class="level-btn ${currentLevel === 'beginner' ? 'active' : ''}" onclick="selectLevel('beginner')">🟢 초급</button>
          <button class="level-btn ${currentLevel === 'intermediate' ? 'active' : ''}" onclick="selectLevel('intermediate')">🟡 중급</button>
          <button class="level-btn ${currentLevel === 'advanced' ? 'active' : ''}" onclick="selectLevel('advanced')">🔴 고급</button>
        </div>

        <div class="audio-bar">
          <div class="audio-controls">
            <button class="btn-sm primary" onclick="playAll()">▶ 전체 듣기</button>
            <button class="btn-sm" onclick="stopAllAudio()">■ 정지</button>
            <span class="audio-badge ${hasMp3 ? 'mp3' : ''}">${hasMp3 ? '🎧 성우 MP3' : '🔊 AI 기본음성'}</span>
          </div>
          <div>
            <select class="speed-select" onchange="changeSpeed(this.value)">
              <option value="0.8" ${speechRate === 0.8 ? 'selected' : ''}>0.8x 느리게</option>
              <option value="0.95" ${speechRate === 0.95 ? 'selected' : ''}>1.0x 보통</option>
              <option value="1.15" ${speechRate === 1.15 ? 'selected' : ''}>1.2x 빠르게</option>
            </select>
          </div>
        </div>

        <div class="story-content">${sentencesHtml}</div>

        <div class="study-meta-box">
          <div class="study-row">
            <span class="study-label">📌 학습 포인트</span>
            <span>${lvlData.points || '-'}</span>
          </div>
          <div class="study-row">
            <span class="study-label">📖 주요 어휘 · 표현</span>
            <span>${lvlData.vocab || '-'}</span>
          </div>
        </div>

        <div class="chunk-box">
          <div class="chunk-label">✨ 오늘의 핵심 대사 (Key Expression)</div>
          <div class="chunk-phrase">${ep.chunk}</div>
          <div class="chunk-desc">${ep.chunkDesc}</div>
        </div>

        <div class="shorts-section">
          <div class="shorts-title">🎥 이 장면, AI 드라마 클립으로 보기</div>
          ${shortsHtml}
        </div>
      </div>
    `;
  }

  function loadYoutubeIframe(epNum, videoId) {
    const box = document.getElementById(`shorts-box-${epNum}`);
    if (!box) return;
    box.onclick = null;
    box.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  }

  function selectEpisode(idx) {
    stopAllAudio();
    currentEpIndex = idx;
    renderLearnerMode();
  }

  function selectLevel(lvl) {
    stopAllAudio();
    currentLevel = lvl;
    renderLearnerMode();
  }

  function changeSpeed(val) {
    speechRate = parseFloat(val);
    mp3Player.playbackRate = speechRate;
  }

  // ==================== 오디오 재생 (MP3 싱크 + TTS 자동 폴백) ====================
  function stopAllAudio() {
    window.speechSynthesis.cancel();
    mp3Player.pause();
    mp3Player.ontimeupdate = null;
    document.querySelectorAll('.sentence-inline').forEach(el => el.classList.remove('speaking'));
  }

  function playAll() {
    stopAllAudio();
    const lvlData = episodesData[currentEpIndex].levels[currentLevel];
    if (lvlData.audioUrl && lvlData.audioUrl.trim() !== "") {
      playMp3WithSync(lvlData.audioUrl, lvlData.sentences, 0);
    } else {
      playTtsSequence(0);
    }
  }

  function playSegment(idx) {
    stopAllAudio();
    const lvlData = episodesData[currentEpIndex].levels[currentLevel];
    if (lvlData.audioUrl && lvlData.audioUrl.trim() !== "") {
      const startSec = lvlData.sentences[idx].start || 0;
      playMp3WithSync(lvlData.audioUrl, lvlData.sentences, startSec);
    } else {
      const el = document.getElementById(`sent-${idx}`);
      if (!el) return;
      el.classList.add('speaking');
      const cleanText = lvlData.sentences[idx].text.replace(/^\[\d+\]\s*/, '');
      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.lang = 'ko-KR';
      utter.rate = speechRate;
      utter.onend = () => el.classList.remove('speaking');
      window.speechSynthesis.speak(utter);
    }
  }

  function playMp3WithSync(url, sentences, startTime) {
    if (!mp3Player.src.endsWith(url)) {
      mp3Player.src = url;
    }
    mp3Player.currentTime = startTime;
    mp3Player.playbackRate = speechRate;
    mp3Player.play();

    mp3Player.ontimeupdate = () => {
      const t = mp3Player.currentTime;
      sentences.forEach((s, i) => {
        const el = document.getElementById(`sent-${i}`);
        if (!el) return;
        if (s.end > 0 && t >= s.start && t < s.end) {
          el.classList.add('speaking');
        } else {
          el.classList.remove('speaking');
        }
      });
    };
    mp3Player.onended = () => stopAllAudio();
  }

  function playTtsSequence(idx) {
    const sentences = episodesData[currentEpIndex].levels[currentLevel].sentences;
    if (idx >= sentences.length) return;
    const el = document.getElementById(`sent-${idx}`);
    if (el) el.classList.add('speaking');
    const cleanText = sentences[idx].text.replace(/^\[\d+\]\s*/, '');
    const utter = new SpeechSynthesisUtterance(cleanText);
    utter.lang = 'ko-KR';
    utter.rate = speechRate;
    utter.onend = () => {
      if (el) el.classList.remove('speaking');
      playTtsSequence(idx + 1);
    };
    window.speechSynthesis.speak(utter);
  }

  // ==================== 2. 작가 검수 모드 (?mode=review) ====================
  function renderReviewMode() {
    const cardsHtml = episodesData.map((ep, idx) => {
      const begText = ep.levels.beginner.sentences.map(s => s.text).join("\n\n");
      const intText = ep.levels.intermediate.sentences.map(s => s.text).join("\n\n");
      const advText = ep.levels.advanced.sentences.map(s => s.text).join("\n\n");

      return `
        <div class="review-card">
          <div class="review-top">
            <div>
              <span style="font-size:0.8rem; color:#64748b; font-weight:700;">${ep.arc}</span>
              <h3 style="font-size:1.15rem; color:#0f172a;">${ep.title}</h3>
            </div>
            <span class="status-pill ${ep.status === 'Published' ? 'status-published' : 'status-draft'}" id="badge-${idx}">
              ${ep.status === 'Published' ? '✅ 발행됨 (Published)' : '📝 검수대기 (Draft)'}
            </span>
          </div>

          <div class="review-field">
            <label>🎬 유튜브 쇼츠 ID (11자리 코드)</label>
            <input type="text" id="rev-shorts-${idx}" value="${ep.shortsId || ''}" placeholder="예: dQw4w9WgXcQ" />
          </div>

          <div class="review-field">
            <label>✨ 핵심 대사 (Chunk)</label>
            <input type="text" id="rev-chunk-${idx}" value="${ep.chunk || ''}" />
          </div>

          <div class="review-field">
            <label>🟢 초급 본문 (장면 단위는 빈 줄로 구분)</label>
            <textarea id="rev-beg-${idx}">${begText}</textarea>
          </div>

          <div class="review-field">
            <label>🟡 중급 본문</label>
            <textarea id="rev-int-${idx}">${intText}</textarea>
          </div>

          <div class="review-field">
            <label>🔴 고급 본문</label>
            <textarea id="rev-adv-${idx}">${advText}</textarea>
          </div>

          <div class="review-actions">
            <button class="btn-sm" onclick="saveReview(${idx}, 'Draft')">임시저장 (Draft)</button>
            <button class="btn-sm primary" onclick="saveReview(${idx}, 'Published')">시트 저장 및 발행 승인</button>
          </div>
        </div>
      `;
    }).join("");

    appEl.innerHTML = `
      <div class="review-bar">
        <div>
          <strong>📖 전체 에피소드 연속 검수 뷰 (${episodesData.length}화)</strong>
          <div style="font-size:0.82rem; color:#475569;">수정 후 '시트 저장'을 누르고 Google Sheets 상단 메뉴에서 [GitHub에 발행]을 누르면 즉시 반영됩니다.</div>
        </div>
        <a href="?" class="btn-sm">학습자 화면으로 →</a>
      </div>
      ${cardsHtml}
    `;
  }

  async function saveReview(idx, newStatus) {
    const ep = episodesData[idx];
    const toSentObjs = (raw) => raw.split(/\n\s*\n/).filter(Boolean).map(t => ({ text: t.trim(), start: 0, end: 0 }));

    ep.shortsId = document.getElementById(`rev-shorts-${idx}`).value.trim();
    ep.chunk = document.getElementById(`rev-chunk-${idx}`).value.trim();
    ep.levels.beginner.sentences = toSentObjs(document.getElementById(`rev-beg-${idx}`).value);
    ep.levels.intermediate.sentences = toSentObjs(document.getElementById(`rev-int-${idx}`).value);
    ep.levels.advanced.sentences = toSentObjs(document.getElementById(`rev-adv-${idx}`).value);
    ep.status = newStatus;

    const badge = document.getElementById(`badge-${idx}`);
    badge.className = `status-pill ${newStatus === 'Published' ? 'status-published' : 'status-draft'}`;
    badge.textContent = newStatus === 'Published' ? '✅ 발행됨 (Published)' : '📝 검수대기 (Draft)';

    if (APPS_SCRIPT_URL) {
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            ep: ep.ep,
            status: ep.status,
            shortsId: ep.shortsId,
            chunk: ep.chunk,
            beg_text: ep.levels.beginner.sentences.map(s => s.text).join("\n\n"),
            int_text: ep.levels.intermediate.sentences.map(s => s.text).join("\n\n"),
            adv_text: ep.levels.advanced.sentences.map(s => s.text).join("\n\n")
          })
        });
        showToast(`${ep.ep}화가 Google Sheets에 저장되었습니다!`);
      } catch (e) {
        showToast("시트 저장 중 오류가 발생했습니다.");
      }
    } else {
      showToast(`[로컬 테스트] ${ep.ep}화 수정 완료! ( 연결 시 시트에 자동 저장됩니다)`);
    }
  }

  initApp();
</script>
</body>
</html>
